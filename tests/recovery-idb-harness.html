<!doctype html><html><body><pre id="result">RUNNING</pre><script type="module">
import {createCity,step} from '../src/sim.ts';import {marketJournalForTest} from '../src/market-client.ts';import {createParkRuntime,serializeParkSession} from '../src/park-runtime.ts';import {saveRecoveryCopy,listRecoveryCopies} from '../src/recovery-idb.ts';
const out=document.querySelector('#result');const assert=(x,m)=>{if(!x)throw Error(m)},snapshot=c=>serializeParkSession(c,createParkRuntime(c));
(async()=>{
 const none=await listRecoveryCopies();assert(none.length===0,'no recovery initially');if(indexedDB.databases){const dbs=await indexedDB.databases();assert(!dbs.some(x=>x.name==='citymanager.emergency-recovery-v1'),'startup read created no database');}
 const c=createCity(37),baseline=snapshot(c);let saved=await saveRecoveryCopy(baseline,null),token={branchId:saved.branchId,revision:saved.revision},initial=token,prior='';
 for(let i=0;i<20;i++){prior=snapshot(c);step(c);saved=await saveRecoveryCopy(snapshot(c),token);token={branchId:saved.branchId,revision:saved.revision};}
 let list=await listRecoveryCopies();assert(list.length===3,'expected three slots after 20 rotations');assert(list.find(x=>x.slot==='baseline').snapshot.raw===baseline,'baseline exact');assert(list.find(x=>x.slot==='previous').snapshot.raw===prior,'previous exact');
 let rejected=false;try{await saveRecoveryCopy(snapshot(c),initial)}catch(e){rejected=String(e).includes('recovery-conflict')}assert(rejected,'stale token refused');
 const before=JSON.stringify(list),originalPut=IDBObjectStore.prototype.put;IDBObjectStore.prototype.put=function(...args){const req=originalPut.apply(this,args);this.transaction.abort();return req};step(c);try{await saveRecoveryCopy(snapshot(c),token);throw Error('abort not rejected')}catch(e){assert(String(e).includes('abort'),'abort surfaced')}finally{IDBObjectStore.prototype.put=originalPut}list=await listRecoveryCopies();assert(JSON.stringify(list)===before,'aborted transaction retained all slots');
 let denied=false;try{await saveRecoveryCopy(snapshot(c),null,{open(){throw new DOMException('denied','SecurityError')}})}catch(e){denied=e.name==='SecurityError'}assert(denied,'denied open surfaced');
 const originalGet=IDBObjectStore.prototype.get;IDBObjectStore.prototype.get=function(...args){const req=originalGet.apply(this,args);if(this.transaction.mode==='readonly')Object.defineProperty(req,'result',{get(){return undefined}});return req;};let verify=false;try{await saveRecoveryCopy(snapshot(c),token)}catch(e){verify=String(e).includes('recovery-verification-failed')}finally{IDBObjectStore.prototype.get=originalGet}assert(verify,'readback corruption never reports success');
 list=await listRecoveryCopies();const current=list.find(x=>x.slot==='current').snapshot;assert(current.tick===c.tick,'write may exist after failed readback');token={branchId:current.branchId,revision:current.revision};
 const foreignCity=createCity(91),foreignJournal=marketJournalForTest(null);foreignJournal.guestId='00000000-0000-4000-8000-000000000003';foreignCity.market=foreignJournal;const foreign=await saveRecoveryCopy(snapshot(foreignCity),null);
 const mismatchDb=await new Promise((resolve,reject)=>{const r=indexedDB.open('citymanager.emergency-recovery-v1',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});await new Promise((resolve,reject)=>{const tx=mismatchDb.transaction('branches','readwrite'),store=tx.objectStore('branches'),left=store.get(token.branchId),right=store.get(foreign.branchId);let a,b;left.onsuccess=()=>{a=left.result;if(b){a.previous=b.current;store.put(a,token.branchId)}};right.onsuccess=()=>{b=right.result;if(a){a.previous=b.current;store.put(a,token.branchId)}};tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error)});mismatchDb.close();step(c);let foreignRefused=false;try{await saveRecoveryCopy(snapshot(c),token)}catch(e){foreignRefused=String(e).includes('recovery-branch-invalid')}assert(foreignRefused,'foreign retained identity refused');
 const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('citymanager.emergency-recovery-v1',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});await new Promise((resolve,reject)=>{const tx=db.transaction('branches','readwrite'),store=tx.objectStore('branches'),r=store.get(token.branchId);r.onsuccess=()=>{const branch=r.result;branch.unrecognized='keep';store.put(branch,token.branchId)};tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error)});db.close();step(c);let corrupt=false;try{await saveRecoveryCopy(snapshot(c),token)}catch(e){corrupt=String(e).includes('recovery-branch-invalid')}assert(corrupt,'unknown branch refused');list=await listRecoveryCopies();assert(list.some(x=>!x.snapshot),'invalid branch surfaced');
 out.textContent='PASS '+JSON.stringify({rotations:20,staleRejected:rejected,abortPreserved:true,deniedOpen:denied,readbackFailsClosed:verify,unknownBranchPreserved:corrupt,foreignIdentityPreserved:foreignRefused});
})().catch(e=>{out.textContent='FAIL '+(e.stack||e)});
</script></body></html>
