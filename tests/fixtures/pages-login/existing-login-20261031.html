<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CityManager sign in</title><style>body{font:16px system-ui;max-width:34em;margin:2em auto;padding:0 1em}button,input{font:inherit;padding:.6em;margin:.3em 0}input{width:95%}output{overflow-wrap:anywhere;display:block}section{margin:1.5em 0}</style></head><body><h1>CityManager market</h1><p>Choose how to access your Guest account. Creating a new Guest does not recover an existing account.</p><output id="identity"></output><output id="message" role="status"></output><section><button id="use">Continue with remembered Guest</button><button id="new">Create new Guest</button></section><section><label>Recovery code <input id="recovery" type="password" autocomplete="off"></label><button id="recover">Recover Guest</button></section><section><button id="code">Prepare recovery code</button><output id="secret"></output><button id="confirm-code" disabled>I saved this code</button><p>Save the new code securely, then confirm. Until confirmation, your previous code remains valid.</p></section><script>
const origin='https://nustanakritwithai.github.io',p=new URLSearchParams(location.search),challenge=p.get('challenge'),state=p.get('state'),message=document.getElementById('message'),auto=p.get('auto')==='1',uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;let pendingRecovery=null,handshake=false,expectedGuest=null,authorizing=false,authorized=false;
const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('cm_csrf='))?.slice(8)||'';
async function api(path,body){const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':csrf()},body:JSON.stringify(body)});const b=await r.json();if(!r.ok)throw Error(b.error||'Request failed');return b}
async function act(fn){try{message.textContent='';await fn()}catch(e){message.textContent=e.message}}
async function showIdentity(){const r=await fetch('/citymanager-api/v1/me',{credentials:'same-origin'});document.getElementById('identity').textContent=r.ok?'Remembered Guest: '+(await r.json()).guest_id:'No valid remembered Guest.'}
async function continueGuest(){if(authorizing||authorized)return;authorizing=true;try{if(!window.opener||!/^[A-Za-z0-9_-]{43}$/.test(challenge||'')||!/^[A-Za-z0-9_-]{20,128}$/.test(state||''))throw Error('Invalid login request');let body={challenge};if(handshake){const me=await fetch('/citymanager-api/v1/me',{credentials:'same-origin'});if(!me.ok)throw Error('Remembered Guest unavailable. Recover the original Guest.');const identity=(await me.json()).guest_id;if(typeof identity!=='string'||!uuid.test(identity)||(expectedGuest&&identity.toLowerCase()!==expectedGuest.toLowerCase()))throw Error('Remembered Guest does not match this game. Recover the original Guest.');body={challenge,expected_guest:identity};}const r=await api('/citymanager-api/v1/pages/authorize',body);window.opener.postMessage({type:'citymanager-auth-code',state,code:r.code},origin);authorized=true;message.textContent='Authorization sent. You may close this window.'}finally{authorizing=false}}
document.getElementById('use').onclick=()=>act(continueGuest);
document.getElementById('new').onclick=()=>act(async()=>{if(!confirm('Create a new Guest? This will replace the remembered session in this browser.'))return;await api('/citymanager-api/v1/auth/guest',{});await showIdentity();message.textContent='New Guest created. Generate a recovery code, then continue.'});
document.getElementById('recover').onclick=()=>act(async()=>{await api('/citymanager-api/v1/pages/recover',{recovery_code:document.getElementById('recovery').value});document.getElementById('recovery').value='';await showIdentity();message.textContent='Guest recovered. Continue when ready.'});
document.getElementById('code').onclick=()=>act(async()=>{const r=await api('/citymanager-api/v1/pages/recovery-prepare',{request_id:crypto.randomUUID()});pendingRecovery=r;document.getElementById('secret').textContent=r.recovery_code;document.getElementById('confirm-code').disabled=false;message.textContent='Save this code securely, then confirm; it is not active yet.'});
document.getElementById('confirm-code').onclick=()=>act(async()=>{if(!pendingRecovery)throw Error('Prepare a new code first');await api('/citymanager-api/v1/pages/recovery-confirm',{request_id:pendingRecovery.request_id,recovery_code:pendingRecovery.recovery_code});pendingRecovery=null;document.getElementById('secret').textContent='';document.getElementById('confirm-code').disabled=true;message.textContent='Recovery code confirmed. Any prior code is now invalid.'});
if(auto){document.getElementById('new').disabled=true;if(window.opener&&/^[A-Za-z0-9_-]{43}$/.test(challenge||'')&&/^[A-Za-z0-9_-]{20,128}$/.test(state||'')){let timer,expiry;const ready=()=>window.opener.postMessage({type:'citymanager-auth-ready',state},origin);const receive=e=>{const d=e.data;if(e.origin!==origin||e.source!==window.opener||!d||d.type!=='citymanager-auth-intent'||d.state!==state||!(d.expectedGuest===null||(typeof d.expectedGuest==='string'&&uuid.test(d.expectedGuest))))return;window.removeEventListener('message',receive);clearInterval(timer);clearTimeout(expiry);handshake=true;expectedGuest=d.expectedGuest;document.getElementById('new').disabled=expectedGuest!==null;void act(continueGuest)};window.addEventListener('message',receive);timer=setInterval(ready,500);expiry=setTimeout(()=>{clearInterval(timer);window.removeEventListener('message',receive)},60000);ready();}}
showIdentity().catch(()=>{message.textContent='Unable to check the remembered Guest.'});
</script></body></html>
