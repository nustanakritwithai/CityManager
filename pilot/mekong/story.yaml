# แม่น้ำโขงไหลผ่าน 6 ประเทศ (คลิปสั้น ~31 วินาที)
# ref: ประโยคต้นทางเดียว แบ่งเป็นช่วง
#   §A "แม่น้ำโขงมีต้นน้ำอยู่บนที่ราบสูงทิเบตในประเทศจีน"
#   §B "ไหลลงใต้ผ่านพม่า ลาว ไทย กัมพูชา"
#   §C "และออกทะเลที่สามเหลี่ยมปากแม่น้ำในเวียดนาม"
#   "6 ประเทศ" มาจากคำขอของผู้ใช้ (และนับได้จากเนื้อหา: จีน พม่า ลาว ไทย กัมพูชา เวียดนาม)
meta:
  title: แม่น้ำโขงไหลผ่าน 6 ประเทศ
  width: 1080
  height: 1920
  fps: 24
  basemap: bluemarble
  mapPixelRatio: 0.7
  credits: "ภาพ: NASA Blue Marble · Natural Earth"

places:
  # ต้นน้ำ: จุดเริ่มเส้นแม่น้ำ (Za / ต้นแม่น้ำโขง) ใน Natural Earth — เขตอำเภอจ๋าตัว (Zadoi) ชิงไห่ บนที่ราบสูงทิเบต; ตำแหน่งโดยประมาณ
  source: { name: ต้นน้ำโขง, lng: 94.084, lat: 33.156 }
  delta:  { name: สามเหลี่ยมปากแม่น้ำโขง, lng: 105.222, lat: 9.751 }

layers:
  mekong:   { type: river, src: river-mekong, color: river, label: แม่น้ำโขง, labelAt: [99.2, 24.0], labelAngle: 70, draw: 3.0,
              build: { rivers: [Mekong, Za], upstream: [94.0, 33.2], clip: [88, 8, 125, 36] } }
  china:    { type: area, src: country-china, color: red, fill: 0.18, label: จีน, labelAt: [103.0, 26.5],
              build: { countries: [China], clip: [80, 5, 125, 40] } }
  myanmar:  { type: area, src: country-myanmar, color: teal, fill: 0.2, label: พม่า, labelAt: [98.3, 21.8],
              build: { countries: [Myanmar] } }
  laos:     { type: area, src: country-laos, color: violet, fill: 0.22, label: ลาว, labelAt: [103.4, 20.4],
              build: { countries: [Laos] } }
  thailand: { type: area, src: country-thailand, color: gold, fill: 0.2, label: ไทย, labelAt: [101.4, 15.6],
              build: { countries: [Thailand] } }
  cambodia: { type: area, src: country-cambodia, color: orange, fill: 0.22, label: กัมพูชา, labelAt: [104.0, 13.2],
              build: { countries: [Cambodia] } }
  vietnam:  { type: area, src: country-vietnam, color: "#5fd0ff", fill: 0.2, label: เวียดนาม, labelAt: [107.3, 12.0],
              build: { countries: [Vietnam] } }
  # สำเนาสำหรับฉากสรุป (มุมกว้าง): ตำแหน่งชื่อต่างจากฉากซูม เพื่อไม่ให้ชนกับชื่อกัมพูชา/ลาว
  china_s:   { type: area, src: country-china, color: red, fill: 0.18, label: จีน, labelAt: [108.0, 24.5] }
  vietnam_s: { type: area, src: country-vietnam, color: "#5fd0ff", fill: 0.2, label: เวียดนาม, labelAt: [110.2, 15.6] }

scenes:
  - id: s01
    dur: 4
    title: ["แม่น้ำโขง", "ไหลผ่าน 6 ประเทศ"]
    camera: { center: [100.6, 21.6], zoom: 4.55, move: cut, drift: 0.2 }
    map: [mekong]
    sub: "แม่น้ำสายเดียว ไหลผ่าน **6 ประเทศ**"
    voice: "แม่น้ำโขง แม่น้ำสายเดียว ที่ไหลผ่านหกประเทศ"
    ref: คำขอผู้ใช้ + §A–§C

  - id: s02
    dur: 4.5
    title: ["ต้นน้ำ", "ที่ราบสูงทิเบต"]
    era: ประเทศที่ 1 / 6
    camera: { center: [97.4, 29.0], zoom: 5.3 }
    map: [mekong, china]
    pins:
      - { place: source, style: ripple, color: "#5fd0ff", at: 1.2 }
    sub: ["ต้นน้ำอยู่บน **ที่ราบสูงทิเบต**", "ในประเทศ **จีน**"]
    voice: "ต้นน้ำอยู่บนที่ราบสูงทิเบต ในประเทศจีน"
    ref: §A

  - id: s03
    dur: 3.5
    title: ["ไหลลงใต้", "ผ่านพม่า"]
    era: ประเทศที่ 2 / 6
    camera: { center: [100.7, 21.0], zoom: 6.0 }
    map: [mekong, myanmar]
    sub: "ไหลลงใต้ ผ่าน **พม่า**"
    voice: "ไหลลงใต้ ผ่านพม่า"
    ref: §B

  - id: s04
    dur: 3.5
    title: ["ไหลลงใต้", "ผ่านลาว"]
    era: ประเทศที่ 3 / 6
    camera: { center: [102.6, 19.2], zoom: 5.9 }
    map: [mekong, laos]
    sub: "ผ่าน **ลาว**"
    voice: "ผ่านลาว"
    ref: §B

  - id: s05
    dur: 3.5
    title: ["ไหลลงใต้", "ผ่านไทย"]
    era: ประเทศที่ 4 / 6
    camera: { center: [102.8, 16.4], zoom: 5.9 }
    map: [mekong, thailand]
    sub: "ผ่าน **ไทย**"
    voice: "ผ่านไทย"
    ref: §B

  - id: s06
    dur: 3.5
    title: ["ไหลลงใต้", "ผ่านกัมพูชา"]
    era: ประเทศที่ 5 / 6
    camera: { center: [105.0, 12.6], zoom: 6.3 }
    map: [mekong, cambodia]
    sub: "ผ่าน **กัมพูชา**"
    voice: "ผ่านกัมพูชา"
    ref: §B

  - id: s07
    dur: 4.5
    title: ["ออกทะเล", "ที่เวียดนาม"]
    era: ประเทศที่ 6 / 6
    camera: { center: [106.2, 11.2], zoom: 6.9 }
    map: [mekong, vietnam]
    pins:
      - { place: delta, style: ripple, color: "#5fd0ff", at: 1.4 }
    sub: ["และออกทะเลที่ **สามเหลี่ยมปากแม่น้ำ**", "ในประเทศ **เวียดนาม**"]
    voice: "และออกทะเล ที่สามเหลี่ยมปากแม่น้ำ ในเวียดนาม"
    ref: §C

  - id: s08
    dur: 6
    title: ["สรุป", "แม่น้ำโขง 6 ประเทศ"]
    camera: { center: [101.6, 20.0], zoom: 4.35, focus: 0.3 }
    map: [mekong, china_s, myanmar, laos, thailand, cambodia, vietnam_s]
    cards:
      - { type: summary, title: แม่น้ำโขง, items: ["ต้นน้ำ: **ที่ราบสูงทิเบต** ประเทศจีน", "ไหลลงใต้ผ่าน **พม่า · ลาว · ไทย · กัมพูชา**", "ออกทะเลที่ **สามเหลี่ยมปากแม่น้ำ** ในเวียดนาม"], at: 0.6 }
    sub: "**6 ประเทศ** บนแม่น้ำสายเดียว"
    voice: "สรุป แม่น้ำโขง ไหลผ่านจีน พม่า ลาว ไทย กัมพูชา และเวียดนาม รวมหกประเทศ"
    ref: §A–§C
