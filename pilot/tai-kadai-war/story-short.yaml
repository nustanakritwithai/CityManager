scenes:
  - id: s01
    dur: 4
    title: ["สงครามและการอพยพ", "ของไทกะได"]
    camera: { center: [110.5, 25.5], zoom: 4.75, move: cut, drift: 0.25 }
    sub: "สงคราม คืออีกแรงหนึ่งที่ผลักให้ **ไทกะได** (ผู้พูดภาษาตระกูลนี้) ต้องอพยพ"
    voice: "สงคราม คืออีกแรงที่ผลักให้ไทกะได ต้องอพยพ"
    ref: ย่อหน้าแรก

  - id: s03
    dur: 4.5
    title: ["ราชวงศ์จิ๋นและฮั่นลงใต้"]
    camera: { center: [113.2, 27.6], zoom: 5.35 }
    map: [yangtze, baiyue]
    units:
      - { id: yue1, f: yue, at: [113.4, 25.8], n: 6, r: 120, appear: 1.2 }
    sub: "เดิม **ไป่เยว่** หรือ “คนใต้” อยู่ทางใต้ของ **แม่น้ำแยงซี**"
    voice: "เดิม ไป่เยว่ หรือคนใต้ อยู่ทางใต้ของแม่น้ำแยงซี"
    ref: §1

  - id: s05
    dur: 6
    era: ราว 221 ปีก่อน ค.ศ.
    camera: { center: [112.4, 27.2], zoom: 5.2, move: pan }
    map: [yangtze, baiyue]
    hud: { title: กำลังพล, rows: [{ f: qin, value: "500,000", note: ทัพของถูซุย }], at: 1.4 }
    units:
      - { id: yue1, f: yue, at: [113.4, 25.8], n: 6, r: 120 }
      - { id: qin1, f: qin, at: qin_north, to: [112.8, 26.6], move: [0.5, 7.5], n: 8, r: 40 }
    sub: "ราว 221 ปีก่อน ค.ศ. จิ๋นให้ **ถูซุย** นำทัพ **500,000** ลงใต้"
    voice: "ราวสองร้อยยี่สิบเอ็ดปีก่อนคริสตกาล จิ๋นให้ถูซุย นำทัพห้าแสนลงใต้"
    ref: §1

  - id: s06b
    dur: 8
    fx: [night]
    night: 0.3
    imagery: sentinel2016
    era: ภาพจำลองการรบ (ต้นฉบับไม่ระบุสถานที่)
    callout: ซุ่มโจมตีกลางคืน
    camera: { center: [110.3500, 25.1500], zoom: 12.4, pitch: 58, bearing: 20, focus: 0.5, moveDur: 2.8, orbit: 10, drift: 0.2 }
    units:
      - { id: qinF1, f: qin, kind: formation, tile: 550, gap: 130, at: [110.3434, 25.1599], rows: 2, cols: 7, icon: spear, heading: 200, appear: 2.2 }
      - { id: qinF2, f: qin, kind: formation, tile: 550, gap: 130, at: [110.3665, 25.1698], rows: 2, cols: 5, icon: spear, heading: 200, appear: 2.4 }
