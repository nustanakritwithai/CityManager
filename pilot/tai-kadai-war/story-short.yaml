    sub: "สมัยถัง ค.ศ. 622–866 เกิดสงคราม **เฉลี่ยทุก 5–6 ปี**"
    voice: "สมัยราชวงศ์ถัง เกิดสงครามเฉลี่ยทุกห้าถึงหกปี"
