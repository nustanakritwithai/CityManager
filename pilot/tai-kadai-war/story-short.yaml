    sub: "คนใต้หนีเข้าป่า **ไม่ยอมเป็นทาส** โจมตีกลางคืน จน **แม่ทัพถูซุย** ถูกสังหาร"
    voice: "คนใต้หนีเข้าป่า ไม่ยอมเป็นทาส ออกโจมตีในเวลากลางคืน จนแม่ทัพถูซุยถูกสังหาร"
    ref: §1 (ไหวหนานจื่อ)

  - id: s10
    dur: 7
    camera: { center: [114.6, 27.4], zoom: 5.2 }
    map: [yangtze, huai, huaiyz]
    zones: [han]
    units:
      - { id: han1, f: han, at: [113.0, 29.0], to: [111.0, 24.0], move: [0.5, 3.2], n: 7, r: 45 }
    routes:
