    sub: ["ฮั่นลงมาปราบรัฐทางใต้", "แล้ว **เทครัว** คนใต้ 500,000 คน ขึ้นไปอยู่ระหว่างแม่น้ำหวยกับแยงซี"]
    voice: "ฮั่นลงมาปราบ แล้วเทครัวคนใต้ห้าแสนคน ขึ้นไปอยู่ระหว่างแม่น้ำหวยกับแยงซี"
    ref: §1


