# ref: ชี้กลับไปที่ส่วนของเนื้อหาต้นทาง (§1 ฮั่น, §2 ถัง, §3 หนงจื้อเกา, §4 แผนที่รูป 2, §5 สรุป, §N หมายเหตุ)
