scenes:
  # ───────────── เปิดเรื่อง ─────────────
  - id: s01
    dur: 6
    title: ["สงครามและการอพยพ", "ของไทกะได"]
    camera: { center: [110.5, 25.5], zoom: 4.75, move: cut, drift: 0.25 }
    sub: "สงคราม คืออีกแรงหนึ่งที่ผลักให้ **ไทกะได** หรือ **ขร้าไท** ต้องอพยพ"
    ref: ย่อหน้าแรก

  - id: s02
    dur: 6
    cards:
      - { type: words, lead: true, items: [{ w: ไทกะได = ขร้าไท }, { w: ผู้พูดภาษาตระกูลนี้, n: ไม่ใช่เชื้อชาติ }] }
    sub: "ไทกะได ไม่ใช่เชื้อชาติ แต่หมายถึง **ผู้พูดภาษาตระกูลนี้**"
    ref: §N

  # ───────────── 1 การลงมาของฮั่น ─────────────
  - id: s03
    dur: 7
    title: ["1 · การลงมาของฮั่น"]
    camera: { center: [113.2, 27.6], zoom: 5.35 }
    map: [yangtze, baiyue]
    units:
      - { id: yue1, f: yue, at: [113.4, 25.8], n: 6, r: 120, appear: 1.2 }
    sub: "เดิม **ไป่เยว่** หรือ “คนใต้” อยู่ทางใต้ของ **แม่น้ำแยงซี**"
    ref: §1

  - id: s04
    dur: 8
    map: [yangtze, baiyue]
    units:
      - { id: yue1, f: yue, at: [113.4, 25.8], n: 6, r: 120 }
    cards:
      - { type: words, items: [{ w: ไทกะได }, { w: ม้ง-เหมี่ยน }, { w: ออสโตรเอเชียติก, n: เวียดนาม · ถิ่น-มาล }, { w: ออสโตรนีเซียน, n: ชวา · มาเลย์ }] }
    sub: "คนใต้เป็นบรรพชนซีกสำคัญของผู้พูดภาษา **4 ตระกูล**"
    ref: §1

  - id: s05
    dur: 10
    era: ราว 221 ปีก่อน ค.ศ.
    camera: { center: [112.4, 27.2], zoom: 5.2, move: pan }
    map: [yangtze, baiyue]
    hud: { title: กำลังพล, rows: [{ f: qin, value: "500,000", note: ทัพของถูซุย }], at: 1.4 }
    units:
      - { id: yue1, f: yue, at: [113.4, 25.8], n: 6, r: 120 }
      - { id: qin1, f: qin, at: qin_north, to: [112.8, 26.6], move: [0.5, 7.5], n: 8, r: 40 }
    cards:
      - { type: panel, scene: army, tunic: "#2b2b2b", helmet: "#7a1f1a", flag: "#c62d22", sky: dusk, color: red, at: 2.0 }
    sub: ["จิ๋นซีฮ่องเต้อยากได้ของป่าและเมืองท่า", "จึงให้ **ถูซุย** นำทัพ **500,000** ลงใต้"]
    ref: §1

  - id: s06
    dur: 10
    fx: [night]
    map: [yangtze, baiyue]
    units:
      - { id: qin1, f: qin, at: [112.8, 26.6], n: 8, r: 40 }
      - { id: yue1, f: yue, at: [113.4, 25.8], to: [112.9, 26.2], move: [1.0, 3.0], n: 6, r: 120 }
    cards:
      - { type: panel, scene: nightForest, color: "#3d5a3a" }
      - { type: quote, text: "พวก ‘ไป่เยว่’ หนีเข้าป่า อยู่กับสัตว์ ไม่ยอมเป็นทาส… พวกเขาโจมตีในเวลากลางคืน และได้ชัยครั้งใหญ่", by: ไหวหนานจื่อ, at: 1.0 }
    sub: "คนใต้หนีเข้าป่า อยู่กับสัตว์ **ไม่ยอมเป็นทาส**"
    ref: §1

  - id: s06b
    dur: 11
    fx: [night]
    night: 0.3
    imagery: sentinel2016
    era: ภาพจำลองการรบ (ต้นฉบับไม่ระบุสถานที่)
    callout: ซุ่มโจมตีกลางคืน
    camera: { center: [110.3500, 25.1500], zoom: 12.4, pitch: 58, bearing: 20, focus: 0.5, moveDur: 2.8, orbit: 10, drift: 0.2 }
    units:
      - { id: qinF1, f: qin, kind: formation, tile: 550, gap: 130, at: [110.3434, 25.1599], rows: 2, cols: 7, icon: spear, heading: 200, appear: 2.2 }
      - { id: qinF2, f: qin, kind: formation, tile: 550, gap: 130, at: [110.3665, 25.1698], rows: 2, cols: 5, icon: spear, heading: 200, appear: 2.4 }
      - { id: yueA, f: yue, kind: formation, tile: 550, gap: 130, at: [110.3071, 25.1335], to: [110.3302, 25.1500], move: [3.0, 4.0], rows: 1, cols: 4, icon: bow, appear: 2.8 }
      - { id: yueB, f: yue, kind: formation, tile: 550, gap: 130, at: [110.3929, 25.1335], to: [110.3665, 25.1533], move: [3.3, 4.0], rows: 2, cols: 3, icon: spear, appear: 3.0 }
      - { id: yueC, f: yue, kind: formation, tile: 550, gap: 130, at: [110.3335, 25.1170], to: [110.3467, 25.1434], move: [3.6, 4.0], rows: 2, cols: 3, icon: spear, appear: 3.2 }
    volleys:
      - { from: [110.3236, 25.1467], to: [110.3434, 25.1599], at: 5.6, dur: 4, n: 20, spread: 495 }
    sub: "คนใต้ออกโจมตีทัพจิ๋น **ในเวลากลางคืน** และได้ชัยครั้งใหญ่"
    ref: §1 (ไหวหนานจื่อ)

  - id: s07
    dur: 7
    fx: [shake]
    imagery: sentinel2016
    units:
      - { id: yueA, f: yue, kind: formation, tile: 550, gap: 130, at: [110.3302, 25.1500], rows: 1, cols: 4, icon: bow }
      - { id: yueB, f: yue, kind: formation, tile: 550, gap: 130, at: [110.3665, 25.1533], rows: 2, cols: 3, icon: spear }
      - { id: yueC, f: yue, kind: formation, tile: 550, gap: 130, at: [110.3467, 25.1434], rows: 2, cols: 3, icon: spear }
    cards:
      - { type: polaroid, icon: brokenFlag, caption: ถูซุยถูกสังหาร, xy: [390, 900] }
    sub: "ผู้คนบาดเจ็บล้มตายจำนวนมาก แม้แต่ **แม่ทัพถูซุย** ก็ถูกสังหาร"
    ref: §1 (Kiernan 2017)

  - id: s08
    dur: 9
    camera: { center: [113.26, 23.4], zoom: 6.9 }
    map: [xi, baiyue]
    pins:
      - { place: guangzhou, style: ripple, color: gold, sub: (ปัจจุบัน), at: 1.8 }
    units:
      - { id: qport, f: qin, kind: ship, at: [113.75, 22.55], n: 3, r: 40, appear: 2.4 }
    cards:
      - { type: panel, scene: port, color: gold, leader: guangzhou, at: 2.4 }
    sub: ["แต่สุดท้าย จิ๋นตั้งเมืองท่าได้ที่ **กวางโจว**", "ส่งพ่อค้าและผู้คนลงมาตั้งรกราก **ผสมกับคนใต้**"]
    ref: §1

  - id: s09
    dur: 8
    camera: { center: [112.0, 24.6], zoom: 5.55 }
    map: [minyue, nanyue]
    sub: "สิ้นราชวงศ์จิ๋น เกิดรัฐทางใต้ เช่น **หมิ่นเยว่** (ฟูเจี้ยน) และ **หนานเยว่**"
    ref: §1

  - id: s10
    dur: 12
    camera: { center: [114.6, 27.4], zoom: 5.2 }
    map: [yangtze, huai, huaiyz]
    zones: [han]
    units:
      - { id: han1, f: han, at: [113.0, 29.0], to: [111.0, 24.0], move: [0.5, 3.2], n: 7, r: 45 }
    routes:
      - { id: tk1, path: [[109.8, 23.4], [116.0, 32.0]], style: people, color: gold, curve: -0.12, at: 4.2, draw: 2.6 }
      - { id: tk2, path: [[113.4, 23.9], [117.0, 31.9]], style: people, color: gold, curve: 0.1, at: 4.5, draw: 2.4 }
      - { id: tk3, path: [[118.6, 26.6], [118.2, 31.9]], style: people, color: gold, curve: 0.15, at: 4.8, draw: 2.2 }
    hud: { title: เทครัวขึ้นเหนือ, rows: [{ f: yue, value: "500,000", note: คนใต้ }], at: 5.0 }
    sub: ["กองทัพฮั่นลงมาปราบรัฐทางใต้", "และ **เทครัว** คนใต้ 500,000 คน ไปอยู่ระหว่าง **แม่น้ำหวย** กับ **แยงซี**"]
    ref: §1

  # ───────────── 2 ความไม่สงบในราชวงศ์ถัง ─────────────
  - id: s11
    dur: 9
    title: ["2 · ราชวงศ์ถัง", "สงครามแทบไม่เว้นว่าง"]
    era: { count: [622, 866], prefix: "ค.ศ. ", dur: 4 }
    camera: { center: [109.4, 22.4], zoom: 6.35 }
    map: [tropic, red]
    pins:
      - { place: annam, color: red, at: 0.8 }
      - { place: yung, color: red, at: 1.1 }
      - { place: jung, color: red, at: 1.4 }
      - { place: kuang, color: red, at: 1.7 }
    cards:
      - { type: image, src: /media/fig1.jpg, caption: "รูป 1 · อันนาม ย่ง จุง และกวาง", at: 2.4 }
    sub: "ค.ศ. 622–866 เกิดสงคราม **เฉลี่ยทุก 5–6 ปี** ที่อันนาม จุง และย่ง"
    ref: §2 (Schafer 1967 น. 61–69)

  - id: s12
    dur: 9
    era: ค.ศ. 726
    camera: { center: [108.75, 23.0], zoom: 7.8 }
    map: [tropic]
    pins:
      - { place: yung, color: red }
      - { place: pin, style: flash, color: gold, at: 2.6 }
      - { place: heng, style: flash, color: gold, at: 2.9 }
    units:
      - { id: liang, f: local, at: [108.4, 23.75], to: [109.05, 23.0], move: [0.6, 2.4], n: 5, r: 40 }
      - { id: tang1, f: tang, at: [108.32, 22.72], n: 3, r: 30, appear: 1.0 }
    hud: { rows: [{ f: local, value: "20,000", note: ถูกตัดศีรษะ }], at: 4.0 }
    sub: ["**เหลียง ต้าไห่** นำพวก “หมาน” ยึด Pin และ Heng ในย่ง", "แต่พ่ายแพ้ ถูกตัดศีรษะ **20,000** คน"]
    ref: §2

  - id: s13
    dur: 10
    era: ค.ศ. 728
    camera: { center: [111.9, 23.1], zoom: 6.9 }
    map: [tropic]
    zones: [rise728]
    pins:
      - { place: jung, style: flash, color: gold, at: 0.8 }
      - { place: kuang, style: flash, color: gold, at: 1.1 }
    units:
      - { id: rise1, f: local, at: [112.0, 23.0], n: 7, r: 70, appear: 1.4 }
      - { id: tang2, f: tang, at: [111.8, 25.0], to: [111.9, 23.7], move: [4.0, 2.5], n: 5, r: 35 }
    cards:
      - { type: titlecard, text: ยึดได้กว่า 40 เมือง, sub: ตั้ง **เฉิน สิงฟ่าน** เป็น “โอรสสวรรค์”, color: gold, at: 1.8 }
    hud: { rows: [{ f: local, value: "60,000", note: ถูกปราบและตัดศีรษะ }], at: 6.5 }
    sub: ["คนพื้นเมืองที่ **จุง** และ **กวาง** ลุกฮือ แต่ถูกปราบ", "บันทึกในพงศาวดารถังและ **จือจื้อทงเจี้ยน**"]
    ref: §2

  - id: s14
    dur: 9
    era: ค.ศ. 794–826
    camera: { center: [107.9, 22.8], zoom: 7.3 }
    map: [tropic]
    pins:
      - { place: huangdong, style: flash, color: blue, sub: (โดยประมาณ), at: 0.6 }
      - { place: yung, color: red }
    units:
      - { id: huang1, f: huang, at: huangdong, to: [108.15, 22.78], move: [1.2, 2.6], n: 5, r: 35 }
      - { id: tang1, f: tang, at: [108.32, 22.72], n: 3, r: 30 }
    cards:
      - { type: titlecard, text: ยึดได้ 13 เมือง, sub: ตระกูลหวงสู้ต่อจนถึง ค.ศ. 826, color: blue, at: 4.0 }
    sub: "**หวง เฉิงชิ่ง** นำกลุ่ม **“หุบเขาเหลือง”** และพันธมิตร โจมตีศูนย์กลางของย่ง"
    ref: §2 (Schafer 1967)

  - id: s15
    dur: 11
    era: ค.ศ. 861–863
    camera: { center: [104.6, 23.0], zoom: 5.75 }
    map: [nanzhao, red]
