name: Citizen transport renderer
on:
  pull_request:
    paths:
      - 'src/citizen-*'
      - 'src/scene-citizen-*'
      - 'tests/citizen-*'
      - 'tests/fixtures/citizen-render*'
      - '.github/workflows/citizen-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/citizen-*.test.ts
      - run: node node_modules/vite/bin/vite.js build --config tests/citizen-render-vite.config.ts
      - name: Verify isolated 2000-car instancing and capture evidence
        run: |
          New-Item -ItemType Directory -Force .test-output | Out-Null
          $preview = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--config', 'tests/citizen-render-vite.config.ts', '--host', '127.0.0.1', '--port', '4189', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/citizen-preview.log -RedirectStandardError .test-output/citizen-preview-error.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-WebRequest -Uri 'http://127.0.0.1:4189/tests/fixtures/citizen-render.html' -TimeoutSec 2).StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Citizen renderer preview did not start.' }
            node tests/citizen-render-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Citizen renderer acceptance failed.' }
          } finally {
            Stop-Process -Id $preview.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: citizen-renderer-evidence
          path: .test-output/citizen-render-evidence
          if-no-files-found: warn
          retention-days: 3
