name: Signal reading (mock API)

on:
  pull_request:
    paths:
      - 'src/signal-*'
      - 'tests/signal-*'
      - '.github/workflows/signal-reading.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reading:
    name: Verify captured signals and S22 controls
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Exercise reports with intercepted mocks only
        run: |
          New-Item -ItemType Directory -Force .test-output | Out-Null
          $readingPreview = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4187', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/reading-preview.log -RedirectStandardError .test-output/reading-preview-error.log
          try {
            $readingReady = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-WebRequest -Uri 'http://127.0.0.1:4187/CityManager/' -TimeoutSec 2).StatusCode -eq 200) { $readingReady = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $readingReady) { throw 'Signal reading preview did not start.' }
            node --experimental-strip-types tests/signal-reading-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Signal reading acceptance failed.' }
          } finally {
            Stop-Process -Id $readingPreview.Id -ErrorAction SilentlyContinue
          }
