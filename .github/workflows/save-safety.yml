name: City save safety
on:
  pull_request:
    paths:
      - 'src/main.ts'
      - 'src/server-city-*.ts'
      - 'src/city-save-auth.ts'
      - 'src/pages-auth.ts'
      - 'tests/pages-auth.test.ts'
      - 'tests/pages-login-public-contract.test.mjs'
      - 'tests/fixtures/pages-login/*'
      - 'src/city-migration-inventory.ts'
      - 'tests/server-city-*'
      - 'tests/server-save-*'
      - 'tests/city-migration-inventory.test.ts'
      - 'server/city-saves/service.mjs'
      - 'src/autosave.ts'
      - 'src/save-*.ts'
      - 'src/startup-save.ts'
      - 'src/startup-save-feedback.ts'
      - 'src/startup-recovery-chooser.ts'
      - 'src/local-city-save.ts'
      - 'src/recovery-idb.ts'
      - 'src/active-local-save.ts'
      - 'tests/active-local-save-*'
      - 'tests/recovery-idb-*'
      - 'tests/recovery-unavailable-browser.mjs'
      - 'tests/save-quota-lossless.test.ts'
      - 'src/market-client.ts'
      - 'src/entry-gate.ts'
      - 'tests/save-safety*'
      - 'tests/save-startup*'
      - 'tests/save-recovery-info.test.ts'
      - 'tests/save-equivalence.test.ts'
      - 'tests/load-authority.test.ts'
      - '.github/workflows/save-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saves:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Select exact visual scope
        id: scope
        run: node scripts/ci-visual-scope.mjs
      - name: Verify scope routing
        run: node --test tests/ci-visual-scope.test.mjs
      - run: npm ci --no-audit --no-fund
        if: steps.scope.outputs.kind != 'visual-final'
      - run: node --experimental-strip-types --test tests/save-safety.test.ts tests/save-startup-diagnosis.test.ts tests/save-startup-feedback.test.ts tests/save-recovery-info.test.ts tests/save-equivalence.test.ts tests/load-authority.test.ts tests/autosave.test.ts tests/education-session.test.ts tests/save-quota-lossless.test.ts tests/save-promotion.test.ts tests/active-local-save.test.ts
        if: steps.scope.outputs.kind != 'visual-final'
      - run: npm run build
        if: steps.scope.outputs.kind != 'visual-final'
        env:
          VITE_MARKET_URL: http://127.0.0.1:4317
      - name: Verify server-only city contract and legacy read-only migration
        if: steps.scope.outputs.kind != 'visual-final'
        run: node --experimental-strip-types --test tests/server-city-entry.test.ts tests/server-city-entry-flow.test.ts tests/city-migration-inventory.test.ts tests/server-city-save.test.ts tests/pages-auth.test.ts tests/pages-login-public-contract.test.mjs
      - name: Verify production bundle against isolated existing-login server fixture
        if: steps.scope.outputs.kind != 'visual-final'
        run: |
          node tests/server-save-browser-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Server-only browser acceptance failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.scope.outputs.kind != 'visual-final'
        with:
          name: save-safety-evidence
          path: .test-output/server-save-smoke/*.*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3
