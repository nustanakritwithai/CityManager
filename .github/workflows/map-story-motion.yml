name: Map story motion safety

on:
  pull_request:
    paths:
      - 'pilot/engine/**'
      - 'skills/map-story-motion/**'
      - 'skills/map-story-motion.skill'
      - 'tests/map-story-motion.test.mjs'
      - 'tests/map-story-package.test.py'
      - '.github/workflows/map-story-motion.yml'
  push:
    branches: [main]
    paths:
      - 'pilot/engine/**'
      - 'skills/map-story-motion/**'
      - 'skills/map-story-motion.skill'
      - 'tests/map-story-motion.test.mjs'
      - 'tests/map-story-package.test.py'
      - '.github/workflows/map-story-motion.yml'

permissions:
  contents: read

jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned FFmpeg and ffprobe (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/media-tools" --no-save --ignore-scripts --no-audit --no-fund @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          chmod +x "$RUNNER_TEMP/media-tools/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/media-tools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          echo "$RUNNER_TEMP/media-tools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/media-tools/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Chocolatey)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked engine dependencies
        shell: pwsh
        run: |
          npm ci --prefix skills/map-story-motion/engine --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix pilot/engine --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Playwright Chromium
        run: node skills/map-story-motion/engine/node_modules/playwright/cli.js install chromium
      - run: node --test tests/map-story-motion.test.mjs
        env:
          MAP_REQUIRE_FFMPEG: '1'
          MAP_REQUIRE_MAPSHAPER: '1'
          MAP_TEST_MODULES: ${{ github.workspace }}/skills/map-story-motion/engine/node_modules
          MAP_TEST_PILOT_MODULES: ${{ github.workspace }}/pilot/engine/node_modules
          MAP_REQUIRE_BROWSER: '1'
      - run: python tests/map-story-package.test.py
