name: Map story motion safety

on:
  pull_request:
    paths:
      - 'pilot/engine/**'
      - 'skills/map-story-motion/**'
      - 'skills/map-story-motion.skill'
      - 'tests/map-story-motion.test.mjs'
      - 'tests/map-story-package.test.py'
      - '.github/workflows/map-story-motion.yml'
  push:
    branches: [main]
    paths:
      - 'pilot/engine/**'
      - 'skills/map-story-motion/**'
      - 'skills/map-story-motion.skill'
      - 'tests/map-story-motion.test.mjs'
      - 'tests/map-story-package.test.py'
      - '.github/workflows/map-story-motion.yml'

permissions:
  contents: read

jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install FFmpeg (Ubuntu packages)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Chocolatey)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned geo test dependencies
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/map-geo-deps" --no-save --ignore-scripts --omit=optional --no-audit --no-fund mapshaper@0.6.99 yaml@2.6.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node --test tests/map-story-motion.test.mjs
        env:
          MAP_REQUIRE_FFMPEG: '1'
          MAP_REQUIRE_MAPSHAPER: '1'
          MAP_TEST_MODULES: ${{ runner.temp }}/map-geo-deps/node_modules
      - run: python tests/map-story-package.test.py
