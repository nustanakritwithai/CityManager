name: Map story motion safety

on:
  pull_request:
    paths:
      - 'pilot/engine/**'
      - 'skills/map-story-motion/**'
      - 'skills/map-story-motion.skill'
      - 'tests/map-story-motion.test.mjs'
      - 'tests/map-story-package.test.py'
      - '.github/workflows/map-story-motion.yml'
  push:
    branches: [main]
    paths:
      - 'pilot/engine/**'
      - 'skills/map-story-motion/**'
      - 'skills/map-story-motion.skill'
      - 'tests/map-story-motion.test.mjs'
      - 'tests/map-story-package.test.py'
      - '.github/workflows/map-story-motion.yml'

permissions:
  contents: read

jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tests/map-story-motion.test.mjs
      - run: python tests/map-story-package.test.py
