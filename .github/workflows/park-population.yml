name: Large population acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/park-*.ts'
      - 'src/sim.ts'
      - 'src/housing.ts'
      - 'src/main.ts'
      - 'src/server-*.ts'
      - 'server/city-saves/**'
      - 'tests/park-population*'
      - 'tests/traffic-server-entry-fixture.mjs'
      - 'tests/panel-ui-server.mjs'
      - 'tests/panel-server-entry-fixture.mjs'
      - 'tests/population-capacity-fixture.ts'
      - 'tests/touch-reach.mjs'
      - 'package*.json'
      - '.github/workflows/park-population.yml'
  push:
    branches: [main]
    paths:
      - 'src/park-*.ts'
      - 'src/sim.ts'
      - 'src/housing.ts'
      - 'src/main.ts'
      - 'src/server-*.ts'
      - 'server/city-saves/**'
      - 'tests/park-population*'
      - 'tests/traffic-server-entry-fixture.mjs'
      - 'tests/panel-ui-server.mjs'
      - 'tests/panel-server-entry-fixture.mjs'
      - 'tests/population-capacity-fixture.ts'
      - 'tests/touch-reach.mjs'
      - 'package*.json'
      - '.github/workflows/park-population.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: park-population-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: 4098 residents / Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify large population and recreation regression
        run: |
          node --experimental-strip-types --test tests/park-population.test.ts tests/park-recreation.test.ts tests/park-runtime.test.ts
          node --experimental-strip-types tests/park-population-browser.mjs --preflight
      - name: Build production bundle
        env:
          VITE_MARKET_URL: 'https://citymanager.157-85-96-139.sslip.io/citymanager-api'
          VITE_CITY_ENTITY_ADVISOR_ONLINE: 'true'
          VITE_CITY_OWNER_ADVISOR_ONLINE: 'true'
        run: npm run build
      - name: Verify real recreation, pause, native server save and reload
        env:
          CITYMANAGER_BROWSER: google-chrome
        run: |
          npm run preview -- --port 4196 > /tmp/park-population-preview.log 2>&1 &
          node --experimental-strip-types tests/park-population-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: park-population-evidence
          path: .test-output/park-population-browser/*.*
          if-no-files-found: warn
          retention-days: 5
