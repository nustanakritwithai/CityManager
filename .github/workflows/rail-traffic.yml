name: Rail traffic acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rail/**'
      - 'src/traffic/**'
      - 'src/park-runtime.ts'
      - 'src/sim.ts'
      - 'src/road-topology.ts'
      - 'src/expanded-*.ts'
      - 'src/main.ts'
      - 'tests/rail-*'
      - 'tests/fixtures/save-smoke/bus-optional-day60.json'
      - 'tests/server-save-browser-smoke.mjs'
      - 'package*.json'
      - '.github/workflows/rail-traffic.yml'
  push:
    branches: [main]
    paths:
      - 'src/rail/**'
      - 'src/traffic/**'
      - 'src/park-runtime.ts'
      - 'src/sim.ts'
      - 'src/road-topology.ts'
      - 'src/expanded-*.ts'
      - 'src/main.ts'
      - 'tests/rail-*'
      - 'tests/fixtures/save-smoke/bus-optional-day60.json'
      - 'tests/server-save-browser-smoke.mjs'
      - 'package*.json'
      - '.github/workflows/rail-traffic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rail-traffic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    name: Accepted rail demand / Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify conserved demand and browser fixture
        run: node --experimental-strip-types --test tests/rail-game-worker.test.ts tests/rail-game-bridge.test.ts tests/rail-traffic-intake.test.ts tests/rail-browser-fixture.test.ts
      - name: Build production bundle
        env:
          VITE_MARKET_URL: 'https://citymanager.157-85-96-139.sslip.io/citymanager-api'
          VITE_CITY_ENTITY_ADVISOR_ONLINE: 'true'
          VITE_CITY_OWNER_ADVISOR_ONLINE: 'true'
        run: npm run build
      - name: Verify actual rail intake, movement and server reload
        env:
          CITYMANAGER_BROWSER: google-chrome
          CITYMANAGER_RAIL_CHECKS: activation
        run: node --experimental-strip-types tests/server-save-browser-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rail-traffic-evidence
          path: .test-output/server-save-smoke/*
          if-no-files-found: warn
          retention-days: 5
