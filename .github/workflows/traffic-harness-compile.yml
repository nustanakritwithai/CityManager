name: Traffic harness compiler diagnosis (no browser launch)
on:
  push:
    branches: ['diagnostic/housing-harness-compile']
    paths:
      - '.github/workflows/traffic-harness-compile.yml'
      - 'scripts/diagnostic-owned-process.ps1'
      - 'scripts/diagnostic-compiler-diagnostics.ps1'
      - 'tests/diagnostic-compiler-diagnostics.fixture.ps1'
      - 'tests/diagnostic-owned-process.test.mjs'
      - 'tests/traffic-harness-compile.test.mjs'
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Preserve compile-only plan before contracts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .test-output/harness-compile -ErrorAction Stop | Out-Null
          @{ commit='${{ github.sha }}'; purpose='Compile fixed embedded source only; no broker Run, job or browser launch'; priorRun='https://github.com/nustanakritwithai/CityManager/actions/runs/42380138115'; status='not-started' } | ConvertTo-Json | Set-Content -Encoding UTF8 .test-output/harness-compile/plan.json
      - name: Verify compiler-only boundary contracts
        run: node --test tests/diagnostic-owned-process.test.mjs tests/traffic-harness-compile.test.mjs
      - name: Verify native diagnostic fixtures without compiling or launching broker
        shell: powershell
        run: |
          & ./scripts/diagnostic-owned-process.ps1 -DiagnosticsFixtureOnly 2>&1 | Tee-Object -FilePath .test-output/harness-compile/extractor-fixtures.log
          exit $LASTEXITCODE
      - name: Compile once without invoking native broker
        shell: powershell
        run: |
          & ./scripts/diagnostic-owned-process.ps1 -CompileOnly 2>&1 | Tee-Object -FilePath .test-output/harness-compile/compiler.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: traffic-harness-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-output/harness-compile/
          if-no-files-found: error
          retention-days: 30
