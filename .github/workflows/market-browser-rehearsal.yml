name: Isolated Pages market browser rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/market-browser-rehearsal.yml'
      - 'tests/ci-pages-market-rehearsal.mjs'
      - 'tests/fixtures/market-server/**'
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Optional artifact ID (requires run ID and SHA-256)'
        type: string
        required: false
      artifact_run_id:
        description: 'Workflow run ID for the optional artifact'
        type: string
        required: false
      artifact_sha256:
        description: 'Expected SHA-256 of the optional artifact ZIP'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out test-only source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate optional artifact inputs
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          if [[ -n "$ARTIFACT_ID$ARTIFACT_RUN_ID$ARTIFACT_SHA256" ]]; then
            [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ && "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Supply a numeric artifact ID, run ID and lowercase SHA-256 together'; exit 1; }
          fi
      - name: Download optional verified Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cm-artifact
          skip-decompress: 'true'
          digest-mismatch: error
      - name: Verify optional artifact SHA-256 before extraction
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_id != ''
        env:
          CM_ARTIFACT: ${{ runner.temp }}/cm-artifact
          CM_DEST: ${{ runner.temp }}/cm-pages
          CM_EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, stat, zipfile
          source = pathlib.Path(os.environ['CM_ARTIFACT'])
          files = list(source.rglob('*.zip'))
          if len(files) != 1:
              raise SystemExit('expected exactly one artifact ZIP')
          expected = os.environ['CM_EXPECTED_SHA256']
          if hashlib.sha256(files[0].read_bytes()).hexdigest() != expected:
              raise SystemExit('artifact digest mismatch')
          dest = pathlib.Path(os.environ['CM_DEST']).resolve()
          dest.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(files[0]) as archive:
              for item in archive.infolist():
                  target = (dest / item.filename).resolve()
                  if target != dest and dest not in target.parents:
                      raise SystemExit('unsafe artifact path')
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('artifact symlink rejected')
              archive.extractall(dest)
          print('verified supplied artifact digest:', expected)
          PY
      - name: Build Pages from this run's exact source
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_id == ''
        env:
          VITE_MARKET_URL: 'https://citymanager.157-85-96-139.sslip.io/citymanager-api'
          VITE_CITY_ENTITY_ADVISOR_ONLINE: 'true'
          VITE_CITY_OWNER_ADVISOR_ONLINE: 'true'
          CM_DEST: ${{ runner.temp }}/cm-pages
        run: |
          npm ci --no-audit --no-fund
          npm run build
          cp -a dist "$CM_DEST"
      - name: Record frontend provenance
        env:
          CM_DEST: ${{ runner.temp }}/cm-pages
          CM_MANIFEST: ${{ runner.temp }}/cm-frontend-manifest.json
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['CM_DEST'])
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(root.rglob('*')) if p.is_file()}
          if 'index.html' not in files:
              raise SystemExit('frontend index missing')
          manifest = {'checkout_head': os.environ['EXPECTED_HEAD'], 'files': files,
                      'mode': 'supplied-artifact' if os.environ['ARTIFACT_ID'] else 'current-run-build',
                      'artifact_id': os.environ['ARTIFACT_ID'] or None,
                      'artifact_run_id': os.environ['ARTIFACT_RUN_ID'] or None,
                      'artifact_sha256': os.environ['ARTIFACT_SHA256'] or None}
          payload = json.dumps(manifest, sort_keys=True, separators=(',', ':')).encode()
          pathlib.Path(os.environ['CM_MANIFEST']).write_bytes(payload)
          print('checkout:', manifest['checkout_head'], 'mode:', manifest['mode'], 'manifest sha256:', hashlib.sha256(payload).hexdigest())
          PY
      - name: Retain frontend provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isolated-market-frontend-provenance
          path: ${{ runner.temp }}/cm-frontend-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Install locked CI fixture dependencies
        run: |
          npm ci --prefix tests/fixtures/market-server --ignore-scripts --no-audit --no-fund
          npm ci --prefix skills/map-story-motion/engine --ignore-scripts --no-audit --no-fund
      - name: Start disposable runner PostgreSQL and exercise actual game popup
        env:
          CI_MARKET_FIXTURE: '1'
          CI_MARKET_ARTIFACT_DIR: ${{ runner.temp }}/cm-pages
          CI_MARKET_SCREENSHOT_DIR: ${{ runner.temp }}/cm-screens
          MAP_TEST_MODULES: ${{ github.workspace }}/skills/map-story-motion/engine/node_modules
          CI_MARKET_FRONTEND_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_MARKET_FRONTEND_MODE: ${{ inputs.artifact_id && 'supplied-artifact' || 'current-run-build' }}
        run: |
          sudo systemctl start postgresql.service
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v ci_password="$password" <<'SQL'
          CREATE ROLE ci_market LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'ci_password';
          SQL
          sudo -u postgres createdb --owner=ci_market citymanager_ci
          export DATABASE_URL="postgresql://ci_market:${password}@127.0.0.1:5432/citymanager_ci"
          node tests/ci-pages-market-rehearsal.mjs
      - name: Retain fake-account browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isolated-market-browser-screens
          path: ${{ runner.temp }}/cm-screens
          if-no-files-found: ignore
          retention-days: 1
