name: CityManager

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citymanager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact source
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test deterministic simulation
        run: npm test

      - name: Verify admitted asset integrity
        run: npm run assets:verify

      - name: Type check and build static game
        run: npm run build

      - name: Verify the built game in installed Edge
        run: |
          New-Item -ItemType Directory -Force .test-output | Out-Null
          $previewProcess = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4173', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/preview.log -RedirectStandardError .test-output/preview-error.log
          try {
            $previewReady = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/CityManager/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $previewReady = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $previewReady) { throw 'Vite preview did not start on port 4173.' }
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw "Browser acceptance failed with exit code $LASTEXITCODE." }
            $env:CITYMANAGER_BLOCK_MODELS = '1'
            $env:CITYMANAGER_SCREENSHOT_DIR = '.test-output/fallback'
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw "Procedural fallback acceptance failed with exit code $LASTEXITCODE." }
          } finally {
            Stop-Process -Id $previewProcess.Id -ErrorAction SilentlyContinue
          }

      - name: Read existing Pages metadata
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: 'false'

      - name: Upload tested static build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publish verified Pages build
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact to existing Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
