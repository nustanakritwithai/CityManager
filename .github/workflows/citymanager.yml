name: CityManager

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citymanager-${{ github.ref }}
  # Superseded PR heads are obsolete; never interrupt a main-branch deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify exact source
    runs-on: windows-latest
    timeout-minutes: 25
    # User-requested incident scope for PR89 only; later changes retain the full suite.
    env:
      CITYMANAGER_SAVE_HOTFIX: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 89) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[save-hotfix-89]')) }}
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact PR head or pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Select checks from the exact changed paths
        id: scope
        run: node scripts/ci-visual-scope.mjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test deterministic simulation and save boundaries
        run: |
          node --test tests/ci-visual-scope.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CI scope classifier tests failed.' }
          if ('${{ steps.scope.outputs.tower_only }}' -eq 'true') {
            node --experimental-strip-types --test tests/building-visuals.test.ts tests/asset-models-runtime.test.ts tests/atmosphere.test.ts
            if ($LASTEXITCODE -ne 0) { throw 'Tower visual regressions failed.' }
          } elseif ('${{ steps.scope.outputs.kind }}' -eq 'factory') {
            node --experimental-strip-types --test tests/factory-visuals.test.ts tests/atmosphere.test.ts
            if ($LASTEXITCODE -ne 0) { throw 'Factory visual regressions failed.' }
          } elseif ('${{ steps.scope.outputs.kind }}' -eq 'vehicle') {
            node --experimental-strip-types --test tests/vehicle-visuals.test.ts tests/citizen-vehicle-poses.test.ts tests/taxi-vehicle-poses.test.ts tests/atmosphere.test.ts
            if ($LASTEXITCODE -ne 0) { throw 'Vehicle visual regressions failed.' }
          } elseif ($env:CITYMANAGER_SAVE_HOTFIX -eq 'true') {
            node --experimental-strip-types --test tests/save-safety.test.ts tests/save-storage.test.ts tests/autosave.test.ts tests/education-session.test.ts tests/entry-gate.test.ts tests/market-client.test.ts tests/market-writer.test.ts tests/market-safety.test.ts
            if ($LASTEXITCODE -ne 0) { throw 'Save boundary regressions failed.' }
          } else { npm test; if ($LASTEXITCODE -ne 0) { throw 'Simulation tests failed.' } }

      - name: Verify preserved advisor contract offline
        if: env.CITYMANAGER_SAVE_HOTFIX != 'true' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        run: npm run test:advisor

      - name: Verify admitted asset integrity
        if: env.CITYMANAGER_SAVE_HOTFIX != 'true'
        run: npm run assets:verify

      - name: Type check and build static game
        env:
          VITE_MARKET_URL: 'https://citymanager.157-85-96-139.sslip.io/citymanager-api'
          VITE_CITY_ENTITY_ADVISOR_ONLINE: 'true'
          VITE_CITY_OWNER_ADVISOR_ONLINE: 'true'
        run: npm run build

      - name: Upload Pages market verification artifact
        if: github.event_name == 'pull_request' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: citymanager-pages-market-verification-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Build loopback market verification artifact
        if: github.event_name == 'pull_request' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        env:
          VITE_MARKET_URL: 'http://127.0.0.1:4317'
          VITE_CITY_ENTITY_ADVISOR_ONLINE: 'true'
          VITE_CITY_OWNER_ADVISOR_ONLINE: 'true'
        run: node node_modules/vite/bin/vite.js build --outDir .test-output/market-sandbox-dist

      - name: Upload loopback market verification artifact
        if: github.event_name == 'pull_request' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: citymanager-market-sandbox-dist
          path: .test-output/market-sandbox-dist
          if-no-files-found: error
          retention-days: 3

      - name: Build same-origin public market test artifact
        if: github.event_name == 'pull_request' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        env:
          VITE_MARKET_URL: '/citymanager-api'
          VITE_BASE_PATH: '/citymanager/'
          VITE_CITY_ENTITY_ADVISOR_ONLINE: 'true'
          VITE_CITY_OWNER_ADVISOR_ONLINE: 'true'
        run: node node_modules/vite/bin/vite.js build --outDir .test-output/citymanager-public-test-dist

      - name: Upload same-origin public market test artifact
        if: github.event_name == 'pull_request' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: citymanager-public-test-dist
          path: .test-output/citymanager-public-test-dist
          if-no-files-found: error
          retention-days: 3

      - name: Build isolated actual-engine tower fixture
        if: steps.scope.outputs.tower_only == 'true'
        run: node node_modules/vite/bin/vite.js build --config vite.luxury-tower.config.ts

      - name: Build isolated actual-engine factory fixture
        if: steps.scope.outputs.kind == 'factory'
        run: node node_modules/vite/bin/vite.js build --config vite.factory.config.ts

      - name: Build isolated actual-engine vehicle fixture
        if: steps.scope.outputs.kind == 'vehicle'
        run: node node_modules/vite/bin/vite.js build --config vite.vehicle.config.ts

      - name: Verify the built game in installed Edge
        run: |
          New-Item -ItemType Directory -Force .test-output | Out-Null
          $previewArgs = @('node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4173', '--strictPort')
          if ('${{ steps.scope.outputs.tower_only }}' -eq 'true') { $previewArgs += @('--config', 'vite.luxury-tower.config.ts') }
          if ('${{ steps.scope.outputs.kind }}' -eq 'factory') { $previewArgs += @('--config', 'vite.factory.config.ts') }
          if ('${{ steps.scope.outputs.kind }}' -eq 'vehicle') { $previewArgs += @('--config', 'vite.vehicle.config.ts') }
          $previewProcess = Start-Process -FilePath (Get-Command node).Source -ArgumentList $previewArgs -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/preview.log -RedirectStandardError .test-output/preview-error.log
          $productionPreview = $null
          try {
            if ('${{ steps.scope.outputs.kind }}' -in @('tower', 'factory', 'vehicle')) {
              $env:CITYMANAGER_PRODUCTION_URL = 'http://127.0.0.1:4174/CityManager/'
              $productionPreview = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4174', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/production-preview.log -RedirectStandardError .test-output/production-preview-error.log
              $productionReady = $false
              for ($attempt = 0; $attempt -lt 40; $attempt++) {
                try { if ((Invoke-WebRequest -Uri $env:CITYMANAGER_PRODUCTION_URL -TimeoutSec 2).StatusCode -eq 200) { $productionReady = $true; break } } catch {}
                Start-Sleep -Milliseconds 500
              }
              if (-not $productionReady) { throw 'Production dist preview did not start on port 4174.' }
            }
            $previewReady = $false
            $previewUrl = 'http://127.0.0.1:4173/CityManager/'
            if ('${{ steps.scope.outputs.tower_only }}' -eq 'true') { $previewUrl += 'tests/luxury-tower-preview.html' }
            if ('${{ steps.scope.outputs.kind }}' -eq 'factory') { $previewUrl += 'tests/factory-preview.html' }
            if ('${{ steps.scope.outputs.kind }}' -eq 'vehicle') { $previewUrl += 'tests/vehicle-preview.html' }
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $previewUrl -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $previewReady = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $previewReady) { throw 'Vite preview did not start on port 4173.' }
            if ('${{ steps.scope.outputs.tower_only }}' -eq 'true') {
              node --experimental-strip-types tests/luxury-tower-smoke.mjs
              if ($LASTEXITCODE -ne 0) { throw 'Tower browser evidence failed.' }
            } elseif ('${{ steps.scope.outputs.kind }}' -eq 'factory') {
              node --experimental-strip-types tests/factory-smoke.mjs
              if ($LASTEXITCODE -ne 0) { throw 'Factory browser evidence failed.' }
            } elseif ('${{ steps.scope.outputs.kind }}' -eq 'vehicle') {
              node --experimental-strip-types tests/vehicle-smoke.mjs
              if ($LASTEXITCODE -ne 0) { throw 'Vehicle browser evidence failed.' }
            } elseif ($env:CITYMANAGER_SAVE_HOTFIX -eq 'true') {
              npm run test:browser
              if ($LASTEXITCODE -ne 0) { throw 'Save startup browser smoke failed.' }
              npm run test:population
              if ($LASTEXITCODE -ne 0) { throw 'Legacy and population save round trips failed.' }
              npm run test:agriculture
              if ($LASTEXITCODE -ne 0) { throw 'Farm legacy migration and quota regression failed.' }
            } else {
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw "Browser acceptance failed with exit code $LASTEXITCODE." }
            npm run test:submenus
            if ($LASTEXITCODE -ne 0) { throw "Submenu acceptance failed with exit code $LASTEXITCODE." }
            npm run test:context
            if ($LASTEXITCODE -ne 0) { throw "Contextual GUI acceptance failed with exit code $LASTEXITCODE." }
            npm run test:compact
            if ($LASTEXITCODE -ne 0) { throw "Compact mobile GUI acceptance failed with exit code $LASTEXITCODE." }
            npm run test:population
            if ($LASTEXITCODE -ne 0) { throw "Household and housing acceptance failed with exit code $LASTEXITCODE." }
            npm run test:worker
            if ($LASTEXITCODE -ne 0) { throw "Worker capability acceptance failed with exit code $LASTEXITCODE." }
            npm run test:agriculture
            if ($LASTEXITCODE -ne 0) { throw "Agriculture acceptance failed with exit code $LASTEXITCODE." }
            npm run test:building-cards
            if ($LASTEXITCODE -ne 0) { throw "Building card acceptance failed with exit code $LASTEXITCODE." }
            npm run test:building-progression
            if ($LASTEXITCODE -ne 0) { throw "Building progression acceptance failed with exit code $LASTEXITCODE." }
            node --experimental-strip-types tests/building-issues-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "Building issue icon acceptance failed with exit code $LASTEXITCODE." }
            npm run test:roads
            if ($LASTEXITCODE -ne 0) { throw "Road topology acceptance failed with exit code $LASTEXITCODE." }
            npm run test:audio
            if ($LASTEXITCODE -ne 0) { throw "Audio acceptance failed with exit code $LASTEXITCODE." }
            $env:CITYMANAGER_BLOCK_MODELS = '1'
            $env:CITYMANAGER_SCREENSHOT_DIR = '.test-output/fallback'
            npm run test:browser
            if ($LASTEXITCODE -ne 0) { throw "Procedural fallback acceptance failed with exit code $LASTEXITCODE." }
            npm run test:submenus
            if ($LASTEXITCODE -ne 0) { throw "Submenu fallback acceptance failed with exit code $LASTEXITCODE." }
            npm run test:context
            if ($LASTEXITCODE -ne 0) { throw "Contextual GUI fallback acceptance failed with exit code $LASTEXITCODE." }
            npm run test:compact
            if ($LASTEXITCODE -ne 0) { throw "Compact mobile GUI fallback acceptance failed with exit code $LASTEXITCODE." }
            npm run test:population
            if ($LASTEXITCODE -ne 0) { throw "Household and housing fallback acceptance failed with exit code $LASTEXITCODE." }
            npm run test:worker
            if ($LASTEXITCODE -ne 0) { throw "Worker capability fallback acceptance failed with exit code $LASTEXITCODE." }
            npm run test:agriculture
            if ($LASTEXITCODE -ne 0) { throw "Agriculture fallback acceptance failed with exit code $LASTEXITCODE." }
            npm run test:building-cards
            if ($LASTEXITCODE -ne 0) { throw "Building card fallback acceptance failed with exit code $LASTEXITCODE." }
            }
          } finally {
            Stop-Process -Id $previewProcess.Id -ErrorAction SilentlyContinue
            if ($null -ne $productionPreview) { Stop-Process -Id $productionPreview.Id -ErrorAction SilentlyContinue }
          }

      - name: Preserve tower browser evidence
        if: always() && steps.scope.outputs.tower_only == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luxury-tower-browser-evidence
          path: |
            .test-output/luxury-tower/*.png
            .test-output/luxury-tower/report.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve factory browser evidence
        if: always() && steps.scope.outputs.kind == 'factory'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-browser-evidence
          path: |
            .test-output/factory/*.png
            .test-output/factory/report.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve vehicle browser evidence
        if: always() && steps.scope.outputs.kind == 'vehicle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vehicle-browser-evidence
          path: |
            .test-output/vehicle/*.png
            .test-output/vehicle/report.json
          if-no-files-found: error
          retention-days: 3

      - name: Preserve building progression browser evidence
        if: always() && github.event_name == 'pull_request' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: building-progression-browser-evidence
          path: |
            .test-output/building-progression/*.png
            .test-output/building-issues/*.png
            .test-output/building-issues/report.json
            .test-output/roads/*.png
            .test-output/roads/select-menu-report.json
            .test-output/roads/grouped-tool-menu-report.json
            docs/worker-preview/worker-failure.png
            .test-output/fallback/worker-failure.png
            .test-output/worker-report.json
            docs/population-preview/phone-population-2000.png
            .test-output/fallback/phone-population-2000.png
            docs/context-preview/home-tap-house-panel.png
            docs/context-preview/low-quality-traffic-retained.png
            .test-output/fallback/home-tap-house-panel.png
          if-no-files-found: warn
          retention-days: 3

      - name: Verify preserved signal GUI without provider calls
        if: env.CITYMANAGER_SAVE_HOTFIX != 'true' && steps.scope.outputs.kind != 'tower' && steps.scope.outputs.kind != 'factory' && steps.scope.outputs.kind != 'vehicle'
        run: |
          $env:VITE_CITY_SIGNALS = 'false'
          $env:VITE_CITY_ADVISOR_ONLINE = 'false'
          node node_modules/vite/bin/vite.js build --outDir .test-output/signals-offline-dist
          if ($LASTEXITCODE -ne 0) { throw 'Offline signal build failed.' }
          $env:CITYMANAGER_SIGNALS_URL = 'http://127.0.0.1:4187/CityManager/'
          $env:CITYMANAGER_SIGNALS_SCREENSHOT_DIR = '.test-output/signals'
          $signalsPreview = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--outDir', '.test-output/signals-offline-dist', '--host', '127.0.0.1', '--port', '4187', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/signals-preview.log -RedirectStandardError .test-output/signals-preview-error.log
          try {
            $signalsReady = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try { if ((Invoke-WebRequest -Uri $env:CITYMANAGER_SIGNALS_URL -TimeoutSec 2).StatusCode -eq 200) { $signalsReady = $true; break } } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $signalsReady) { throw 'Offline signal preview did not start.' }
            npm run test:signals
            if ($LASTEXITCODE -ne 0) { throw 'Preserved signal GUI acceptance failed.' }
          } finally {
            Stop-Process -Id $signalsPreview.Id -ErrorAction SilentlyContinue
          }

      - name: Read existing Pages metadata
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: 'false'

      - name: Upload tested static build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publish verified Pages build
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact to existing Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
