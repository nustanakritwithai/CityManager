name: Thai Guest login synthetic mobile review
on:
  pull_request:
    paths:
      - '.github/workflows/thai-login-browser.yml'
      - 'patches/pages-login-thai/**'
      - 'tests/pages-login-*.mjs'
permissions:
  contents: read
jobs:
  synthetic-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Run focused mock tests
        run: node --test tests/pages-login-races.test.mjs tests/pages-login-thai.test.mjs tests/pages-login-public-contract.test.mjs
      - name: Install Thai fonts for synthetic rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-thai-tlwg
          fc-list :lang=th | grep -q .
      - name: Run isolated synthetic mobile browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/pages-login-browser-ci.mjs
      - name: Retain synthetic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thai-guest-synthetic-mobile
          path: .test-output/thai-auth/*.png
          if-no-files-found: warn
          retention-days: 7
