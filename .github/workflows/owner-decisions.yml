name: Owner decisions (local rules)

on:
  pull_request:
    paths:
      - 'src/owner-decision*'
      - 'src/main.ts'
      - 'scripts/owner-decision-benchmark.mjs'
      - 'tests/owner-decision*'
      - '.github/workflows/owner-decisions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner:
    name: Verify local owner rules and mobile controls
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Select exact visual scope
        id: scope
        run: node scripts/ci-visual-scope.mjs
      - name: Verify scope routing
        run: node --test tests/ci-visual-scope.test.mjs
      - name: Verify affected commercial data contracts (legacy browser not run)
        if: steps.scope.outputs.kind == 'commercial'
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed.' }
          node --experimental-strip-types --test tests/owner-decision.test.ts tests/owner-decision-session.test.ts tests/owner-decision-client.test.ts tests/owner-decision-e2e.test.ts tests/owner-decision-monthly.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Commercial data contract failed.' }
      - run: npm ci --no-audit --no-fund
        if: steps.scope.outputs.kind != 'visual-final' && steps.scope.outputs.kind != 'server-save' && steps.scope.outputs.kind != 'classic-toolbar' && steps.scope.outputs.kind != 'history' && steps.scope.outputs.kind != 'commercial' && steps.scope.outputs.kind != 'rail'
      - name: Verify decision and journal boundaries
        if: steps.scope.outputs.kind != 'visual-final' && steps.scope.outputs.kind != 'server-save' && steps.scope.outputs.kind != 'classic-toolbar' && steps.scope.outputs.kind != 'history' && steps.scope.outputs.kind != 'commercial' && steps.scope.outputs.kind != 'rail'
        run: node --experimental-strip-types --test tests/owner-decision.test.ts tests/owner-decision-session.test.ts
      - run: npm run build
        if: steps.scope.outputs.kind != 'visual-final' && steps.scope.outputs.kind != 'server-save' && steps.scope.outputs.kind != 'classic-toolbar' && steps.scope.outputs.kind != 'history' && steps.scope.outputs.kind != 'commercial' && steps.scope.outputs.kind != 'rail'
      - name: Exercise actual local rule controls without provider traffic
        if: steps.scope.outputs.kind != 'visual-final' && steps.scope.outputs.kind != 'server-save' && steps.scope.outputs.kind != 'classic-toolbar' && steps.scope.outputs.kind != 'history' && steps.scope.outputs.kind != 'commercial' && steps.scope.outputs.kind != 'rail'
        run: |
          New-Item -ItemType Directory -Force .test-output | Out-Null
          $ownerPreview = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4191', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/owner-preview.log -RedirectStandardError .test-output/owner-preview-error.log
          try {
            $ownerReady = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-WebRequest -Uri 'http://127.0.0.1:4191/CityManager/' -TimeoutSec 2).StatusCode -eq 200) { $ownerReady = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ownerReady) { throw 'Owner preview did not start.' }
            $env:CITYMANAGER_OWNER_COMMIT = (git rev-parse HEAD).Trim()
            node --experimental-strip-types tests/owner-decision-smoke.mjs --run
            if ($LASTEXITCODE -ne 0) { throw 'Owner decision browser acceptance failed.' }
          } finally {
            Stop-Process -Id $ownerPreview.Id -ErrorAction SilentlyContinue
          }
