name: City fact questions (local data)

on:
  pull_request:
    paths:
      - 'src/city-questions*'
      - 'src/context-panels*'
      - 'src/building-card*'
      - 'src/signal-panel.ts'
      - 'tests/city-questions*'
      - '.github/workflows/city-questions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  questions:
    name: Verify grounded local questions on S22
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Select exact commercial scope
        id: scope
        run: node scripts/ci-visual-scope.mjs
      - run: node --test tests/ci-visual-scope.test.mjs tests/panel-server-entry-fixture.test.mjs
      - name: Verify relevant panel data
        run: |
          if ('${{ steps.scope.outputs.kind }}' -eq 'commercial') {
            node --experimental-strip-types --test tests/city-questions.test.ts tests/context-data.test.ts tests/building-card-data.test.ts tests/commercial-display-data.test.ts tests/commercial-panels.test.ts
            if ($LASTEXITCODE -ne 0) { throw 'Commercial panel data failed.' }
          } else { npm test; if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' } }
      - run: npm run build
      - name: Exercise facts without additional API data
        run: |
          New-Item -ItemType Directory -Force .test-output | Out-Null
          $questionPreview = Start-Process -FilePath (Get-Command node).Source -ArgumentList @('node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4188', '--strictPort') -WindowStyle Hidden -PassThru -RedirectStandardOutput .test-output/question-preview.log -RedirectStandardError .test-output/question-preview-error.log
          try {
            $questionReady = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                if ((Invoke-WebRequest -Uri 'http://127.0.0.1:4188/CityManager/' -TimeoutSec 2).StatusCode -eq 200) { $questionReady = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $questionReady) { throw 'City question preview did not start.' }
            $env:CITYMANAGER_SIGNALS_COMMIT = (git rev-parse HEAD).Trim()
            node --experimental-strip-types tests/city-questions-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw 'City question acceptance failed.' }
          } finally {
            Stop-Process -Id $questionPreview.Id -ErrorAction SilentlyContinue
          }

      - name: Preserve actual panel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: city-questions-evidence
          retention-days: 3
          path: |
            .test-output/city-questions/*.png
            .test-output/city-questions/qa.json
          if-no-files-found: error
